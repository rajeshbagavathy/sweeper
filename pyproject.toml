[project]
name = "algotest-sweeper"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.45",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false
