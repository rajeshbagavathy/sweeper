[project]
name = "algotest-sweeper"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.45",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
# Windows-only: the MTQuant desktop-app integration (src/mtquant/). Never
# installed by a plain `uv sync` - see docs/mtquant-integration.md. Install
# explicitly on Windows with `uv sync --extra mtquant`.
mtquant = [
    "pywinauto>=0.6.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false
